<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · Employee Management System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">EMPLOYEE MANAGEMENT SYSTEM</div>
    <div class="who">
      <span id="whoAmI">Signed in</span>
      <button class="btn btn-ghost" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="container">
    <div class="page-head">
      <div>
        <h1>Employee records</h1>
        <p>Create, view, update, and remove employee records.</p>
      </div>
      <button class="btn btn-teal" id="addBtn">+ Add employee</button>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Position</th>
            <th>Salary</th>
            <th>Joined</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        No employees yet. Click "Add employee" to create the first record.
      </div>
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Add employee</h2>
      <div class="error-box" id="formErrorBox"></div>
      <form id="employeeForm">
        <input type="hidden" id="employeeId" />
        <div class="form-grid">
          <div class="field full">
            <label for="name">Full name</label>
            <input type="text" id="name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required />
          </div>
          <div class="field">
            <label for="phone">Phone (10 digits)</label>
            <input type="text" id="phone" maxlength="10" required />
          </div>
          <div class="field">
            <label for="department">Department</label>
            <input type="text" id="department" required />
          </div>
          <div class="field">
            <label for="position">Position</label>
            <input type="text" id="position" required />
          </div>
          <div class="field">
            <label for="salary">Salary (₹/month)</label>
            <input type="number" id="salary" min="1" required />
          </div>
          <div class="field">
            <label for="joiningDate">Joining date</label>
            <input type="date" id="joiningDate" required />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-teal" id="saveBtn">Save employee</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/dashboard.js"></script>
</body>
</html>
